<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which Shot is the most Energy-Efficient?</title>
    <style>
        /* Your existing styles here */
        #mcgImage {
            max-width: 80%;
            height: auto;
            display: block;
            margin: 20px auto;
        }
        #result {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Which Shot is the most Energy-Efficient?</h1>
    
    <div>
        <!-- Your wind speed and wind direction inputs -->
        <label for="windSpeed">Wind Speed (m/s): </label>
        <input type="number" id="windSpeed" placeholder="Enter wind speed" required><br>
        
        <label for="windDirection">Wind Direction (eg: "North to South"): </label>
        <input type="text" id="windDirection" placeholder="Enter wind direction (e.g., North to South)" required><br>
        
        <button onclick="sendData()">Submit</button>
    </div>

    <!-- MCg Image -->
    <img src="mcg.jpeg" id="mcgImage" alt="MCG Ground">
    
    <!-- Output result section -->
    <div id="result"></div>
    
    <script>
        // Function to send data to the backend
        function sendData() {
            const windSpeed = document.getElementById('windSpeed').value;
            const windDirection = document.getElementById('windDirection').value;

            // Create an object with the input data
            const data = {
                windSpeed: parseFloat(windSpeed),
                windDirection: windDirection
            };

            // Send data to backend using Fetch API
            fetch('/get-shot', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                // Get the result from the backend
                const resultLine = data.result;

                // Display the result in the #result div
                document.getElementById('result').innerHTML = `<p>${resultLine}</p>`;
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
